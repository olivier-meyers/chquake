# chquake run configuration.
# Every model parameter lives here. Parameters taken from external sources are cited in a comment
# (source + DOI). Sections for exposure, hazard, vulnerability and financial terms are added per
# milestone; nothing is filled in until it has a verified source.

run:
  seed: 42              # master RNG seed, for reproducibility
  n_years: 50000        # length of the simulated catalogue (years); ~5 min. 10k was too noisy.
  output_dir: outputs

# Input files, fetched by scripts/download_data.py (pinned tags + SHA-256; sources and DOIs there).
data:
  raw_dir: data/raw
  exposure: Exposure_Model_Switzerland_Res.csv                       # ESRM20 exposure v1.0
  vulnerability: vulnerability_total-repl-cost_ESRM20_VariousIM.xml  # ESRM20 v1.0
  vulnerability_mapping: esrm20_exposure_vulnerability_mapping.csv   # ESRM20 v1.0
  area_sources: asm_ver12e_winGT_fs017_combined.xml                  # ESHM20 asm, doi:10.12686/a15
  gmpe_logic_tree: gmpe_logic_tree_5br_slope_geology.xml             # Kotha et al. 2020, doi:10.1007/s10518-020-00869-1
  site_model: Site_model_Switzerland.xml                             # ESRM20 v1.0

hazard:
  tectonic_region: Shallow Default   # all ESHM20 area sources within reach of Switzerland
  max_distance_km: 200               # sources and site-event pairs beyond this are ignored
  imts: [PGA, SA(0.3), SA(0.6), SA(1.0)]   # the four IMTs used by the ESRM20 functions
  gmpe_branch: sample_per_year       # one Kotha branch per simulated year, by published weight
  correlation:
    # Jayaram & Baker (2009), doi:10.1002/eqe.922. false = case 1 (Vs30 not clustered).
    vs30_clustering: false
    # Baker & Jayaram (2008), doi:10.1193/1.2857544, applied to between-event residuals
    # always; true also applies it to within-event residuals (option C). false = OpenQuake.
    within_cross_im: true
  # Total ground-motion residual truncated at this many sigma (exact truncated normal, see
  # chquake/hazard.py); null = untruncated. A modelling choice, not a published parameter.
  truncation_level: 3
  chunk_events: 128                 # events per ground-motion batch (memory only)

# Historical-rate check only (scripts/historical_rates.py); not used by the loss model.
# ESHM20 main datasets, Danciu et al. (2021), doi:10.12686/eshm20-main-datasets.
validation:
  catalogue: eshm20_unified_catalogue_declustered_v02a.shp
  completeness_zones: eshm20_csz_v06b.shp
  completeness_table: McTable_CSZ_ESHM20_ver_dec2020.xlsx
  zone: SZ02                 # CSZ_CH: covers 91 % of the exposure hull and all its M>=5 events

vulnerability:
  # true: draw each loss ratio from the published Beta distribution (mean + CoV per function,
  # ESRM20, doi:10.7414/EUC-EFEHR-TR002-ESRM20). false: use the mean loss ratio only.
  secondary_uncertainty: true
