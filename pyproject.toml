[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chquake"
version = "0.1.0"
description = "Open earthquake loss model for Swiss residential buildings, benchmarked against ERM-CH23"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "shapely>=2.0",
    "fiona>=1.9",
    "openpyxl>=3.1",
    # openquake.engine==3.26.2 is also required but installed with --no-deps (see README).
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "nbconvert>=7", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, UP: modern syntax, B: bugbear, NPY: numpy rules
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
